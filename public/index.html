<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parking Tracker</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#1b1f27;--muted:#6b7280;--line:#e3e6eb;--green:#16a34a;--red:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#181c25;--text:#e8eaef;--muted:#9aa3b2;--line:#2a303c;--green:#4ade80;--red:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
.wrap{max-width:900px;margin:0 auto}h1{font-size:22px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1;min-width:160px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font-size:16px;text-transform:uppercase;letter-spacing:1px}
button{padding:10px 16px;border:0;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;color:#fff}
.in{background:var(--green)}.out{background:var(--red)}
.stats{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.stat{flex:1;min-width:120px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:24px}.stat span{color:var(--muted);font-size:13px}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-size:12px;text-transform:uppercase}
h2{font-size:16px;margin:0 0 10px}.msg{min-height:20px;margin-top:8px;font-size:14px}.empty{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
<h1>🅿️ Parking Tracker</h1>
<div class="card">
  <div class="row">
    <input id="plate" placeholder="Plate number" autocomplete="off">
    <button class="in" id="btnIn">Entry</button>
    <button class="out" id="btnOut">Exit</button>
  </div>
  <div class="msg" id="msg"></div>
</div>
<div class="stats">
  <div class="stat"><b id="sIn">0</b><span>Currently parked</span></div>
  <div class="stat"><b id="sToday">0</b><span>Visits today</span></div>
  <div class="stat"><b id="sRev">$0.00</b><span>Fees collected</span></div>
</div>
<div class="card"><h2>Currently parked</h2><div class="scroll"><table id="tActive"></table></div></div>
<div class="card"><h2>History</h2><div class="scroll"><table id="tHist"></table></div></div>
</div>
<script>
var $=function(i){return document.getElementById(i)};
function pw(){try{return localStorage.getItem("pw")||""}catch(e){return ""}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fmt(t){return new Date(t).toLocaleString([],{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})}
function dur(ms){var m=Math.max(0,Math.floor(ms/60000)),h=Math.floor(m/60);return(h?h+"h ":"")+(m%60)+"m"}
function msg(t,c){var e=$("msg");e.textContent=t;e.style.color=c||"var(--muted)"}
async function api(path,method,body){
  var r=await fetch(path,{method:method||"GET",headers:{"Content-Type":"application/json","x-app-password":pw()},body:body?JSON.stringify(body):undefined});
  if(r.status===401){
    var p=prompt("Password");
    if(p){try{localStorage.setItem("pw",p)}catch(e){}return api(path,method,body)}
    throw new Error("Password required");
  }
  var d=await r.json().catch(function(){return{}});
  if(!r.ok)throw new Error(d.error||"Request failed");
  return d;
}
async function act(kind,plate){
  plate=plate||$("plate").value;
  try{
    var r=await api("/api/"+kind,"POST",{plate:plate});
    if(kind==="entry")msg(r.plate+" entered at "+fmt(r.entry_time),"var(--green)");
    else msg(r.plate+" left. Time: "+dur(new Date(r.exit_time)-new Date(r.entry_time))+", fee: $"+Number(r.fee).toFixed(2),"var(--green)");
    $("plate").value="";load();
  }catch(e){msg(e.message,"var(--red)")}
}
async function load(){
  try{
    var d=await api("/api/records");
    $("sIn").textContent=d.active.length;$("sToday").textContent=d.stats.today;$("sRev").textContent="$"+d.stats.revenue.toFixed(2);
    var h="<tr><td class='empty'>No cars parked.</td></tr>";
    if(d.active.length){h="<tr><th>Plate</th><th>Time in</th><th>Parked for</th><th></th></tr>";
      d.active.forEach(function(r){h+="<tr><td><b>"+esc(r.plate)+"</b></td><td>"+fmt(r.entry_time)+"</td><td>"+dur(Date.now()-new Date(r.entry_time))+"</td><td><button class='out' data-p='"+esc(r.plate)+"'>Exit</button></td></tr>"})}
    $("tActive").innerHTML=h;
    h="<tr><td class='empty'>No completed visits yet.</td></tr>";
    if(d.history.length){h="<tr><th>Plate</th><th>Time in</th><th>Time out</th><th>Duration</th><th>Fee</th></tr>";
      d.history.forEach(function(r){h+="<tr><td><b>"+esc(r.plate)+"</b></td><td>"+fmt(r.entry_time)+"</td><td>"+fmt(r.exit_time)+"</td><td>"+dur(new Date(r.exit_time)-new Date(r.entry_time))+"</td><td>$"+Number(r.fee).toFixed(2)+"</td></tr>"})}
    $("tHist").innerHTML=h;
  }catch(e){msg(e.message,"var(--red)")}
}
$("btnIn").onclick=function(){act("entry")};$("btnOut").onclick=function(){act("exit")};
$("plate").onkeydown=function(e){if(e.key==="Enter")act("entry")};
$("tActive").onclick=function(e){var p=e.target.getAttribute&&e.target.getAttribute("data-p");if(p)act("exit",p)};
setInterval(load,30000);load();
</script>
</body>
</html>
