<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parking Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --concrete:#e4e8ec; --panel:#f6f8fa; --ink:#18212b; --muted:#5b6876; --line:#cdd4db;
  --sign:#0a52c9; --sign-ink:#fff; --exit:#c8372d; --ok:#14804a; --plate:#fff; --plate-ink:#111820;
  --stall:#0a52c9;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--concrete:#0f151c;--panel:#18212b;--ink:#e8edf2;--muted:#93a1b0;--line:#2b3947;--sign:#3b82f6;--exit:#ef6a5f;--ok:#4cc38a;--plate:#f4f6f8;--stall:#5a9bff}
}
*{box-sizing:border-box}
body{margin:0;background:var(--concrete);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding:20px 16px 48px}
.wrap{max-width:960px;margin:0 auto}
header{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.psign{width:54px;height:54px;border-radius:12px;background:var(--sign);color:var(--sign-ink);display:grid;place-items:center;font:700 40px/1 var(--display);box-shadow:inset 0 0 0 3px rgba(255,255,255,.85)}
header h1{margin:0;font:700 34px/1 var(--display);letter-spacing:.01em}
header p{margin:2px 0 0;color:var(--muted);font-size:14px}
.clock{margin-left:auto;text-align:right;font:600 26px/1 var(--display);letter-spacing:.03em}
.clock small{display:block;font:400 12px var(--body);color:var(--muted);letter-spacing:0;margin-top:3px}

.gate{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
.plate{background:var(--plate);border:3px solid var(--plate-ink);border-radius:12px;padding:3px;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.plate input{width:100%;border:1.5px solid var(--plate-ink);border-radius:8px;background:transparent;color:var(--plate-ink);text-align:center;text-transform:uppercase;font:700 clamp(32px,7vw,48px)/1.15 var(--display);letter-spacing:.14em;padding:6px 8px;outline:none}
.plate input::placeholder{color:#9aa5b1;letter-spacing:.08em}
.plate:focus-within{box-shadow:0 0 0 4px color-mix(in srgb,var(--sign) 35%,transparent)}
.btns{display:flex;gap:10px}
button{font:600 17px var(--body);border:0;border-radius:12px;padding:16px 26px;color:#fff;cursor:pointer;transition:transform .08s,filter .15s}
button:active{transform:translateY(1px)}
button:hover{filter:brightness(1.08)}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.b-in{background:var(--sign)}.b-out{background:var(--exit)}
.msg{grid-column:1/-1;min-height:22px;font-weight:500;color:var(--muted)}
.msg.good{color:var(--ok)}.msg.bad{color:var(--exit)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat b{display:block;font:700 40px/1 var(--display);letter-spacing:.01em}
.stat span{color:var(--muted);font-size:13px}

h2{font:700 24px/1 var(--display);margin:0 0 12px;display:flex;align-items:baseline;gap:10px}
h2 em{font:500 14px var(--body);font-style:normal;color:var(--muted)}
.lot{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:26px}
.stall{background:var(--panel);border:2px dashed var(--stall);border-radius:6px;padding:14px 12px 12px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.chip{background:var(--plate);color:var(--plate-ink);border:2.5px solid var(--plate-ink);border-radius:8px;padding:2px 14px;font:700 28px/1.2 var(--display);letter-spacing:.12em}
.stall .t{font-size:13px;color:var(--muted)}
.stall .t b{color:var(--ink);font-weight:600}
.stall button{width:100%;padding:9px;font-size:14px;background:var(--exit)}
.empty{grid-column:1/-1;border:2px dashed var(--line);border-radius:10px;padding:28px 16px;text-align:center;color:var(--muted)}

.hist{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 14px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
th{color:var(--muted);font-weight:500;font-size:13px}
td.pl{font:700 20px var(--display);letter-spacing:.1em}
td.fee{font-weight:600;text-align:right}th:last-child{text-align:right}

@media (max-width:640px){
  .gate{grid-template-columns:1fr}.btns button{flex:1}
  .stats{gap:8px}.stat{padding:12px}.stat b{font-size:32px}
  header h1{font-size:28px}.clock{font-size:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="psign" aria-hidden="true">P</div>
    <div><h1>Parking Tracker</h1><p>Log cars in and out, and see who is on the lot.</p></div>
    <div class="clock"><span id="clk">--:--</span><small id="dt"></small></div>
  </header>

  <section class="gate" aria-label="Gate">
    <div class="plate"><input id="plate" placeholder="ABC 123" autocomplete="off" maxlength="12" aria-label="Plate number"></div>
    <div class="btns"><button class="b-in" id="btnIn">Log entry</button><button class="b-out" id="btnOut">Log exit</button></div>
    <div class="msg" id="msg" role="status"></div>
  </section>

  <section class="stats">
    <div class="stat"><b id="sIn">0</b><span>Cars on the lot</span></div>
    <div class="stat"><b id="sToday">0</b><span>Visits today</span></div>
    <div class="stat"><b id="sRev">$0.00</b><span>Fees collected</span></div>
  </section>

  <h2>On the lot <em id="lotCount"></em></h2>
  <div class="lot" id="lot"></div>

  <h2>Recent visits</h2>
  <div class="hist"><table id="tHist"></table></div>
</div>

<script>
var $=function(i){return document.getElementById(i)};
var state={active:[],history:[],rate:3};
function pw(){try{return localStorage.getItem("pw")||""}catch(e){return ""}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fmt(t){return new Date(t).toLocaleString([],{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})}
function dur(ms){var m=Math.max(0,Math.floor(ms/60000)),h=Math.floor(m/60);return(h?h+"h ":"")+(m%60)+"m"}
function est(ms){return Math.max(1,Math.ceil(ms/3600000))*state.rate}
function msg(t,c){var e=$("msg");e.textContent=t;e.className="msg "+(c||"")}
function tick(){var d=new Date();$("clk").textContent=d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});$("dt").textContent=d.toLocaleDateString([],{weekday:"long",month:"short",day:"numeric"})}

async function api(path,method,body){
  var r=await fetch(path,{method:method||"GET",headers:{"Content-Type":"application/json","x-app-password":pw()},body:body?JSON.stringify(body):undefined});
  if(r.status===401){
    var p=prompt("Enter the password");
    if(p){try{localStorage.setItem("pw",p)}catch(e){}return api(path,method,body)}
    throw new Error("Password required");
  }
  var d=await r.json().catch(function(){return{}});
  if(!r.ok)throw new Error(d.error||"Request failed");
  return d;
}
async function act(kind,plate){
  plate=plate||$("plate").value;
  try{
    var r=await api("/api/"+kind,"POST",{plate:plate});
    if(kind==="entry")msg(r.plate+" entered at "+fmt(r.entry_time),"good");
    else msg(r.plate+" left after "+dur(new Date(r.exit_time)-new Date(r.entry_time))+". Fee: $"+Number(r.fee).toFixed(2),"good");
    $("plate").value="";load();
  }catch(e){msg(e.message,"bad")}
}
function renderLot(){
  var a=state.active;
  $("lotCount").textContent=a.length?a.length+(a.length===1?" car":" cars"):"";
  if(!a.length){$("lot").innerHTML="<div class='empty'>The lot is empty. Type a plate above and press Log entry.</div>";return}
  $("lot").innerHTML=a.map(function(r){
    var ms=Date.now()-new Date(r.entry_time);
    return "<div class='stall'><div class='chip'>"+esc(r.plate)+"</div>"+
      "<div class='t'>In at <b>"+fmt(r.entry_time)+"</b><br>Parked <b>"+dur(ms)+"</b> &middot; est. <b>$"+est(ms).toFixed(2)+"</b></div>"+
      "<button data-p='"+esc(r.plate)+"'>Log exit</button></div>";
  }).join("");
}
function renderHist(){
  var d=state.history;
  if(!d.length){$("tHist").innerHTML="<tr><td style='color:var(--muted);padding:18px 8px'>No completed visits yet. They show up here after a car leaves.</td></tr>";return}
  var h="<tr><th>Plate</th><th>In</th><th>Out</th><th>Time parked</th><th>Fee</th></tr>";
  d.forEach(function(r){h+="<tr><td class='pl'>"+esc(r.plate)+"</td><td>"+fmt(r.entry_time)+"</td><td>"+fmt(r.exit_time)+"</td><td>"+dur(new Date(r.exit_time)-new Date(r.entry_time))+"</td><td class='fee'>$"+Number(r.fee).toFixed(2)+"</td></tr>"});
  $("tHist").innerHTML=h;
}
async function load(){
  try{
    var d=await api("/api/records");
    state.active=d.active;state.history=d.history;if(d.rate)state.rate=d.rate;
    $("sIn").textContent=d.active.length;$("sToday").textContent=d.stats.today;$("sRev").textContent="$"+d.stats.revenue.toFixed(2);
    renderLot();renderHist();
  }catch(e){msg(e.message,"bad")}
}
$("btnIn").onclick=function(){act("entry")};
$("btnOut").onclick=function(){act("exit")};
$("plate").onkeydown=function(e){if(e.key==="Enter")act("entry")};
$("lot").onclick=function(e){var p=e.target.getAttribute&&e.target.getAttribute("data-p");if(p)act("exit",p)};
tick();setInterval(tick,15000);
setInterval(renderLot,20000);
setInterval(load,30000);load();
</script>
</body>
</html>
